<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ithri Supplier - Dashboard</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .supply-card { border-left:4px solid var(--yellow); background:#fffbe6; border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .supply-card.confirmed { border-left-color:var(--green-light); background:#f0faf0; }
  .supply-card.issue { border-left-color:var(--red); background:#fde2e2; }
  .item-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid rgba(0,0,0,0.08); font-size:0.9rem; }
  .item-row:last-child { border-bottom:none; }
  .day-header { font-weight:700; color:var(--green-dark); margin:16px 0 8px; font-size:1rem; }
</style>
</head>
<body>
<header class="app-header">
  <h1><span class="logo-mark">Ithri</span> Supplier</h1>
  <span style="font-size:0.85rem; cursor:pointer;" onclick="logout()">Logout</span>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="today">Today's Supplies</div>
    <div class="tab" data-tab="history">All Supply History</div>
  </div>

  <!-- TODAY TAB -->
  <div id="tab-today" class="tab-content">
    <div id="todaySuppliesList"><p style="color:var(--gray);">Loading today's supplies...</p></div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" class="tab-content hidden">
    <div class="card">
      <h2>Filter</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
        <div><label>From Date</label><input type="date" id="historyFromDate" style="margin-bottom:0;"></div>
        <div><label>To Date</label><input type="date" id="historyToDate" style="margin-bottom:0;"></div>
      </div>
      <button class="btn small" onclick="loadSupplyHistory()">Load History</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Issue modal -->
<div id="issueModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Raise an Issue</h3>
    <p style="color:var(--gray); font-size:0.85rem; margin-bottom:12px;">
      This supply will be marked as cancelled and flagged to the admin.
    </p>
    <label>What went wrong?</label>
    <select id="issueType" style="margin-bottom:10px;">
      <option value="not_delivered">Not delivered at all</option>
      <option value="wrong_quantity">Wrong quantity supplied</option>
      <option value="damaged">Products damaged in transit</option>
      <option value="other">Other</option>
    </select>
    <label>Details</label>
    <textarea id="issueDetails" rows="3" placeholder="Describe what happened..."></textarea>
    <div class="flex">
      <button class="btn outline" onclick="closeIssueModal()">Cancel</button>
      <button class="btn danger" onclick="submitIssue()">Submit Issue</button>
    </div>
  </div>
</div>

<!-- Delivery date modal: shown only when a supply is confirmed AFTER the day it was sent -->
<div id="deliveryDateModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>📅 When was this delivered?</h3>
    <p id="deliveryDateInfo" style="color:var(--gray); font-size:0.85rem; margin-bottom:12px;"></p>
    <label>Actual delivery date</label>
    <input type="date" id="deliveryDateInput" style="margin-bottom:10px;">
    <div id="deliveryDateError" class="alert error hidden" style="margin-bottom:10px;"></div>
    <div class="flex">
      <button class="btn outline" onclick="closeDeliveryDateModal()">Cancel</button>
      <button class="btn yellow" onclick="submitDeliveryDate()">Confirm Delivery</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="shared/firebase-config.js"></script>
<script>
if (sessionStorage.getItem('ithri_supplier_auth') !== 'true') window.location.href = 'index.html';
function logout() { sessionStorage.removeItem('ithri_supplier_auth'); window.location.href = 'index.html'; }

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
  });
});

let activeIssueRequestId = null;

// ===== TODAY'S SUPPLIES =====
function setupTodaySupplies() {
  db.collection('supplyRequests')
    .where('status', 'in', ['pending_confirmation', 'disputed', 'cancelled_pending_admin_review'])
    .onSnapshot(snap => {
      const listEl = document.getElementById('todaySuppliesList');
      if (snap.empty) {
        listEl.innerHTML = '<div class="card"><div class="empty-state">No supplies pending confirmation right now.</div></div>';
        return;
      }

      // Group by date (createdAt day)
      const grouped = {};
      snap.forEach(doc => {
        const d = doc.data();
        const dateKey = d.createdAt ? d.createdAt.toDate().toISOString().split('T')[0] : 'Unknown Date';
        if (!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push({ id: doc.id, ...d });
      });

      const sortedDates = Object.keys(grouped).sort().reverse();
      let html = '';
      sortedDates.forEach(date => {
        html += `<div class="day-header">📅 ${date}</div>`;
        grouped[date].forEach(req => {
          const itemRows = Object.entries(req.items || {}).map(([p, q]) =>
            `<div class="item-row"><span>${p}</span><strong>${q} units</strong></div>`).join('');

          if (req.status === 'cancelled_pending_admin_review') {
            html += `
              <div class="supply-card issue">
                <div class="flex-between" style="margin-bottom:8px;">
                  <strong>📍 ${req.locationName}</strong>
                  <span class="badge red">Awaiting Admin Review</span>
                </div>
                ${itemRows}
                <div class="alert error" style="margin-top:8px; font-size:0.85rem;"><strong>Issue reported:</strong> ${req.supplierIssueDetails || ''}</div>
              </div>`;
          } else {
            html += `
              <div class="supply-card">
                <div class="flex-between" style="margin-bottom:8px;">
                  <strong>📍 ${req.locationName}</strong>
                  <span class="badge yellow">Pending</span>
                </div>
                ${itemRows}
                ${date < todayStr() ? `<div class="alert warn" style="margin-top:8px; font-size:0.82rem;">Sent on ${date}. When you confirm, you will be asked for the day it was actually delivered.</div>` : ''}
                <div class="flex" style="margin-top:12px;">
                  <button class="btn yellow" onclick="confirmDelivery('${req.id}')">✅ Confirm Delivered</button>
                  <button class="btn danger" onclick="openIssueModal('${req.id}')">⚠️ Raise Issue</button>
                </div>
              </div>`;
          }
        });
      });
      listEl.innerHTML = html;
    });
}

// ===== DELIVERY DATE RULE =====
// A supply counts as "in the fridge" from the day it was DELIVERED, so that date must be right.
//  - Confirmed on the day the admin sent it  -> delivery date = that day (nothing to type).
//  - Confirmed on a later day                -> the supplier must state the real delivery date.
// false = the ONLY date allowed is the day the admin sent the supply.
// true  = any day from the send date up to today is allowed.
const ALLOW_LATER_DELIVERY_DATES = false;

let deliveryRequestId = null;
let deliverySentDate = null;
let deliveryMaxDate = null;

function prettyDate(dateStr) {
  return new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}

function sentDateOf(req) {
  return req.createdAt && req.createdAt.toDate ? req.createdAt.toDate().toISOString().split('T')[0] : null;
}

async function confirmDelivery(requestId) {
  const reqSnap = await db.collection('supplyRequests').doc(requestId).get();
  const req = reqSnap.data();
  if (!req || (req.status !== 'pending_confirmation' && req.status !== 'disputed')) {
    alert('This supply has already been handled.');
    return;
  }

  const sentDate = sentDateOf(req) || todayStr();
  if (sentDate >= todayStr()) {
    // Confirmed on the day it was sent: the delivery date is that day
    if (!confirm("Confirm this supply was delivered as recorded? This will update the location's stock.")) return;
    await finishConfirmDelivery(requestId, sentDate, false);
    return;
  }

  // Confirmed late: make the supplier state the real delivery date
  deliveryRequestId = requestId;
  deliverySentDate = sentDate;
  deliveryMaxDate = ALLOW_LATER_DELIVERY_DATES ? todayStr() : sentDate;

  const input = document.getElementById('deliveryDateInput');
  input.min = sentDate;
  input.max = deliveryMaxDate;
  input.value = sentDate;
  document.getElementById('deliveryDateInfo').innerHTML =
    `${esc(req.locationName || '')}: this supply was sent on <strong>${prettyDate(sentDate)}</strong> but is being confirmed today. ` +
    `Enter the day it was actually delivered. ` +
    (ALLOW_LATER_DELIVERY_DATES
      ? `You can choose any day from ${prettyDate(sentDate)} to ${prettyDate(deliveryMaxDate)}.`
      : `Only <strong>${prettyDate(sentDate)}</strong> is accepted — the day it was sent.`);
  document.getElementById('deliveryDateError').classList.add('hidden');
  document.getElementById('deliveryDateModal').classList.remove('hidden');
}

function closeDeliveryDateModal() {
  document.getElementById('deliveryDateModal').classList.add('hidden');
  deliveryRequestId = null; deliverySentDate = null; deliveryMaxDate = null;
}

async function submitDeliveryDate() {
  const errEl = document.getElementById('deliveryDateError');
  const val = document.getElementById('deliveryDateInput').value;
  if (!val) { errEl.textContent = 'Please enter the delivery date.'; errEl.classList.remove('hidden'); return; }
  if (val < deliverySentDate || val > deliveryMaxDate) {
    errEl.textContent = ALLOW_LATER_DELIVERY_DATES
      ? `That date is not allowed. Choose a day from ${prettyDate(deliverySentDate)} to ${prettyDate(deliveryMaxDate)}.`
      : `That date is not allowed. Only ${prettyDate(deliverySentDate)} is accepted — the day the admin sent this supply.`;
    errEl.classList.remove('hidden');
    return;
  }
  if (!confirm(`Confirm this supply was delivered on ${prettyDate(val)}? This will update the location's stock.`)) return;
  const requestId = deliveryRequestId;
  closeDeliveryDateModal();
  await finishConfirmDelivery(requestId, val, true);
}

async function finishConfirmDelivery(requestId, deliveredOn, enteredBySupplier) {
  const reqRef = db.collection('supplyRequests').doc(requestId);
  const reqSnap = await reqRef.get();
  const req = reqSnap.data();
  if (!req || (req.status !== 'pending_confirmation' && req.status !== 'disputed')) {
    alert('This supply has already been handled.');
    return;
  }

  const locRef = db.collection('locations').doc(req.locationId);
  const locSnap = await locRef.get();
  const current = { ...(locSnap.data().currentStock || locSnap.data().products || {}) };
  for (const [p, q] of Object.entries(req.items)) current[p] = (current[p] || 0) + q;

  await locRef.update({ currentStock: current });
  await reqRef.update({
    status: 'confirmed',
    confirmedBySupplier: true,
    confirmedAt: firebase.firestore.FieldValue.serverTimestamp(),
    deliveredOn,                                   // the day the stock really reached the fridge
    confirmedLate: deliveredOn < todayStr(),
    deliveryDateEnteredBySupplier: !!enteredBySupplier
  });

  alert('Supply confirmed! Stock has been updated.');
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

function openIssueModal(requestId) {
  activeIssueRequestId = requestId;
  document.getElementById('issueType').value = 'not_delivered';
  document.getElementById('issueDetails').value = '';
  document.getElementById('issueModal').classList.remove('hidden');
}

function closeIssueModal() {
  document.getElementById('issueModal').classList.add('hidden');
  activeIssueRequestId = null;
}

async function submitIssue() {
  if (!activeIssueRequestId) return;
  const issueType = document.getElementById('issueType').value;
  const details = document.getElementById('issueDetails').value.trim();
  if (!details) { alert('Please describe the issue.'); return; }

  const reqRef = db.collection('supplyRequests').doc(activeIssueRequestId);
  const reqSnap = await reqRef.get();
  const req = reqSnap.data();

  const issueLabels = {
    not_delivered: 'Not delivered at all',
    wrong_quantity: 'Wrong quantity supplied',
    damaged: 'Products damaged in transit',
    other: 'Other issue'
  };

  // Flag for admin review instead of a dead-end cancellation
  await reqRef.update({
    status: 'cancelled_pending_admin_review',
    cancelledBySupplier: true,
    supplierIssueType: issueType,
    supplierIssueDetails: details,
    cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  // Log to discrepancy records
  await db.collection('discrepancyRecords').add({
    type: 'supply_cancelled',
    locationId: req.locationId,
    locationName: req.locationName,
    supplyRequestId: activeIssueRequestId,
    items: req.items,
    issueType,
    issueLabel: issueLabels[issueType],
    details,
    date: todayStr(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  // Notify admin
  await db.collection('notifications').add({
    type: 'supply_cancelled',
    locationId: req.locationId,
    locationName: req.locationName,
    supplyRequestId: activeIssueRequestId,
    items: req.items,
    issueLabel: issueLabels[issueType],
    details,
    read: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  closeIssueModal();
  alert('Issue reported. This supply is now awaiting admin review — they can correct and re-send it, or cancel it entirely.');
}

// ===== SUPPLY HISTORY =====
function setDefaultHistoryDates() {
  const today = new Date();
  const prior = new Date(today); prior.setDate(prior.getDate() - 30);
  document.getElementById('historyFromDate').value = prior.toISOString().split('T')[0];
  document.getElementById('historyToDate').value = today.toISOString().split('T')[0];
}

async function loadSupplyHistory() {
  const fromDate = document.getElementById('historyFromDate').value;
  const toDate = document.getElementById('historyToDate').value;
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = '<p style="color:var(--gray);">Loading...</p>';

  const snap = await db.collection('supplyRequests').orderBy('createdAt', 'desc').limit(200).get();
  const rows = [];

  snap.forEach(doc => {
    const d = doc.data();
    const dateObj = d.createdAt ? d.createdAt.toDate() : null;
    const dateStr = dateObj ? dateObj.toISOString().split('T')[0] : '';
    if (fromDate && dateStr < fromDate) return;
    if (toDate && dateStr > toDate) return;

    const statusLabel = { confirmed: 'Confirmed', disputed: 'Disputed', cancelled: 'Cancelled', pending_confirmation: 'Pending', cancelled_pending_admin_review: 'Issue Reported — Awaiting Admin' }[d.status] || 'Pending';
    const cardClass = d.status === 'confirmed' ? 'confirmed' : (d.status === 'cancelled' || d.status === 'disputed' || d.status === 'cancelled_pending_admin_review') ? 'issue' : '';
    const itemRows = Object.entries(d.items || {}).map(([p, q]) => `<div class="item-row"><span>${p}</span><strong>${q} units</strong></div>`).join('');

    rows.push(`
      <div class="supply-card ${cardClass}">
        <div class="flex-between" style="margin-bottom:8px;">
          <strong>📍 ${d.locationName}</strong>
          <span class="badge ${d.status === 'confirmed' ? 'green' : (d.status === 'cancelled' || d.status === 'disputed' || d.status === 'cancelled_pending_admin_review') ? 'red' : 'yellow'}">${statusLabel}</span>
        </div>
        <div style="font-size:0.78rem; color:var(--gray); margin-bottom:6px;">${dateStr}${d.deliveredOn ? ` &nbsp;·&nbsp; Delivered: ${d.deliveredOn}${d.confirmedLate ? ' (confirmed late)' : ''}` : ''}</div>
        ${itemRows}
        ${d.supplierIssueDetails ? `<div class="alert error" style="margin-top:8px; font-size:0.85rem;"><strong>Issue:</strong> ${d.supplierIssueDetails}</div>` : ''}
      </div>`);
  });

  listEl.innerHTML = rows.length ? rows.join('') : '<div class="card"><div class="empty-state">No records found for this period.</div></div>';
}

setupTodaySupplies();
setDefaultHistoryDates();
</script>
</body>
</html>
